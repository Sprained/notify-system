{{define "content"}}
<div class="panel">
	<div class="panel-header">
		<div>
			<h2>Regras configuradas</h2>
			<div class="hint">{{len .Routes}} rota(s)</div>
		</div>
	</div>
	<form class="inline-form" method="POST" action="/rotas">
		<div class="field">
			<label>Tópico</label>
			<input type="text" name="topic" placeholder="ex: alertas" required>
		</div>
		<div class="field">
			<label>Assinante</label>
			<select name="subscriber_id" required>
				{{range .Subscribers}}
				<option value="{{.ID}}">{{.Label}}</option>
				{{end}}
			</select>
		</div>
		<div class="field">
			<label>Prioridade mínima</label>
			<select name="min_priority">
				<option value="1">1</option>
				<option value="2">2</option>
				<option value="3" selected>3</option>
				<option value="4">4</option>
				<option value="5">5</option>
			</select>
		</div>
		<div class="field field-submit">
			<label>&nbsp;</label>
			<button class="btn btn-primary" type="submit">Adicionar</button>
		</div>
	</form>
	<div class="table-wrap">
		<table class="data">
			<thead><tr><th>Tópico</th><th>Assinante</th><th>Prioridade mínima</th><th>Ativa</th></tr></thead>
			<tbody>
				{{range .Routes}}
				<tr>
					<td><span class="tag">{{.Topic}}</span></td>
					<td>{{.SubscriberLabel}}</td>
					<td class="cell-mono">≥ {{.MinPriority}}</td>
					<td>{{if .Enabled}}<span class="chip chip-sent">ativa</span>{{else}}<span class="chip chip-pending">inativa</span>{{end}}</td>
				</tr>
				{{else}}
				<tr><td colspan="4" class="empty-note">Nenhuma rota configurada ainda.</td></tr>
				{{end}}
			</tbody>
		</table>
	</div>
</div>
{{end}}
