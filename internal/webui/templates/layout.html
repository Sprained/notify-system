{{define "layout"}}
<!doctype html>
<html lang="pt-BR">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>notify — painel</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
	<div class="shell">
		<aside class="sidebar">
			<div class="brand">
				<div class="brand-mark">
					<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 1.5c-3 0-5 2.2-5 5v2.8L1.8 12H14.2L13 9.3V6.5c0-2.8-2-5-5-5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M6.2 13.2a1.9 1.9 0 0 0 3.6 0" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
				</div>
				<div>
					<div class="brand-name">notify</div>
					<div class="brand-sub">painel</div>
				</div>
			</div>

			<nav class="primary-nav">
				<a class="nav-item{{if eq .ActiveNav "overview"}} active{{end}}" href="/">
					<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1.2" stroke="currentColor" stroke-width="1.3"/><rect x="9" y="1.5" width="5.5" height="5.5" rx="1.2" stroke="currentColor" stroke-width="1.3"/><rect x="1.5" y="9" width="5.5" height="5.5" rx="1.2" stroke="currentColor" stroke-width="1.3"/><rect x="9" y="9" width="5.5" height="5.5" rx="1.2" stroke="currentColor" stroke-width="1.3"/></svg>
					Visão geral
				</a>
				<a class="nav-item{{if eq .ActiveNav "messages"}} active{{end}}" href="/mensagens">
					<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="1.5" y="3" width="13" height="10" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M2 4l6 4.5L14 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
					Mensagens
				</a>
				<a class="nav-item{{if eq .ActiveNav "failed"}} active{{end}}" href="/entregas">
					<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 1.8 14.8 13.5H1.2L8 1.8Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M8 6.3v3.1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><circle cx="8" cy="11.4" r="0.9" fill="currentColor"/></svg>
					Entregas falhadas
				</a>
				<a class="nav-item{{if eq .ActiveNav "routes"}} active{{end}}" href="/rotas">
					<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="3.2" cy="3.2" r="1.7" stroke="currentColor" stroke-width="1.3"/><circle cx="3.2" cy="12.8" r="1.7" stroke="currentColor" stroke-width="1.3"/><circle cx="12.8" cy="8" r="1.7" stroke="currentColor" stroke-width="1.3"/><path d="M4.6 4.2 11.3 7M4.6 11.8 11.3 9" stroke="currentColor" stroke-width="1.3"/></svg>
					Rotas
				</a>
				<a class="nav-item{{if eq .ActiveNav "subscribers"}} active{{end}}" href="/assinantes">
					<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="5" r="2.6" stroke="currentColor" stroke-width="1.3"/><path d="M2.5 14c0-2.8 2.5-4.5 5.5-4.5s5.5 1.7 5.5 4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
					Assinantes
				</a>
				<a class="nav-item{{if eq .ActiveNav "topics"}} active{{end}}" href="/topicos">
					<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 3.5h12M2 8h8M2 12.5h5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
					Tópicos
				</a>
			</nav>

			<div class="sidebar-footer">
				<span>notify-system · homelab</span>
				<span>Raspberry Pi · tailnet</span>
			</div>
		</aside>

		<div class="main">
			<header class="topbar">
				<h1>{{.PageTitle}}</h1>
				<div class="worker-status">
					<span class="pulse-dot"></span>
					worker ativo · polling a cada 10s
				</div>
			</header>
			<div class="content">
				{{template "content" .}}
			</div>
		</div>
	</div>
	<script src="/static/htmx.min.js"></script>
</body>
</html>
{{end}}
