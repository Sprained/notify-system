services:
  notify-system:
    image: ghcr.io/sprained/notify-system:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      HTTP_ADDR: ":8080"
    ports:
      - "8080:8080"
    networks:
      - homelab_net

networks:
  homelab_net:
    external: true
